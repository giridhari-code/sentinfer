# TLS termination in front of kLLM (localhost:8080)
server {
    listen 443 ssl http2;
    server_name kllm.example.com;
    ssl_certificate     /etc/letsencrypt/live/kllm.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kllm.example.com/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;          # SSE streams
        proxy_read_timeout 3600s;
    }
}
